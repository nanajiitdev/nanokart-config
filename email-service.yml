spring:
  application:
    name: email-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        observation-enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: nanaji.itdev@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  reactor:
    context-propagation: auto

server:
  port: 8095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: '[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]'